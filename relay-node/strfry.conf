db = "./strfry-db/"

relay {
    bind = "0.0.0.0"
    port = 7777
    nofiles = 65536
    realIpHeader = "X-Real-IP"

    info {
        name = "LacakHP Community Relay Node"
        description = "Node relay Nostr sukarela untuk jaringan darurat Zero-Knowledge LacakHP."
        pubkey = ""
        contact = ""
    }

    maxWebsocketPayloadSize = 65536
    autoPingSeconds = 55
    enableTcpKeepalive = true

    events {
        maxEventSize = 16384
        rejectEventsNewerThanSeconds = 900
        rejectEventsOlderThanSeconds = 2592000
        ephemeralEventsLifetimeSeconds = 300
    }
}
